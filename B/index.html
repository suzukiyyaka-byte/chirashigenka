const $=s=>document.querySelector(s);let toastTimer;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function populatePeople(){CONTACTS.map((r,index)=>({r,index})).sort((a,b)=>a.r.name.localeCompare(b.r.name,'ja')).forEach(({r,index})=>{const option=document.createElement('option');option.value=String(index);option.textContent=`${r.name} ｜ ${r.department}`;$('#person').append(option)});}populatePeople();
function field(label,value,type=''){const tel='tel:'+value.replace(/[^0-9+]/g,'');const number=type==='mobile'?`<a class="phone-number" href="${tel}" aria-label="${escapeHTML(value)}に電話">${escapeHTML(value)}</a>`:escapeHTML(value);return `<div class="number ${type}"><span>${label}</span><strong>${number}</strong>${type==='mobile'?`<a class="dial" href="${tel}" aria-label="${escapeHTML(value)}に電話">☎ 電話する</a>`:''}<button type="button" class="copy" data-copy="${escapeHTML(value)}" aria-label="${label} ${escapeHTML(value)}をコピー">コピー</button></div>`}
function render(){const person=$('#person').value;const r=person!==''?CONTACTS[Number(person)]:null;$('#count').textContent=r?'1件':'';
$('#results').innerHTML=!r?'<div class="empty"><div class="symbol">☎</div><strong>氏名を選択してください</strong><p>上のプルダウンから選ぶと、連絡先が表示されます。</p></div>':`<article class="card"><div class="dept">${escapeHTML(r.department)}</div><h3 class="name">${escapeHTML(r.name)}</h3><div class="numbers">${r.mobile?field('携帯番号',r.mobile,'mobile'):''}${r.extension?field('内線番号',r.extension,'primary'):''}${r.mobile&&r.short?field('短縮ダイヤル',r.short):''}</div>${!r.extension?'<p class="missing">内線番号の記載なし</p>':''}${r.note?`<p class="note">${escapeHTML(r.note)}</p>`:''}</article>`;}
$('#person').addEventListener('change',render);
$('#results').addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;let copied=false;try{if(navigator.clipboard){await navigator.clipboard.writeText(b.dataset.copy);copied=true}}catch(_){}if(!copied){const ta=document.createElement('textarea');ta.value=b.dataset.copy;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();try{copied=document.execCommand('copy')}catch(_){}ta.remove();b.focus()}$('#toast').textContent=copied?'番号をコピーしました':'コピーできませんでした。番号を選択してコピーしてください。';clearTimeout(toastTimer);toastTimer=setTimeout(()=>{$('#toast').textContent=''},2500)});render();
